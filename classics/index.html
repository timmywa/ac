<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>America's Country Classics | You grew up here...</title>
    <meta name="description" content="Listen to America's Country Classics live – broadcasting classic country hits from the 90s and 2000s.">

    <link rel="icon" type="image/png" href="images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <link rel="shortcut icon" href="images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ACClassics" />
    <link rel="manifest" href="site.webmanifest" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="music.radio_station">
    <meta property="og:title" content="America's Country Classics">
    <meta property="og:description" content="Classic Country Hits 24/7">
    <meta property="og:url" content="https://americascountry.us/classics">

    <!-- Schema.org Radio Station Metadata -->

      "@context": "https://schema.org",
      "@type": "RadioStation",
      "name": "America's Country Classics",

        "https://www.facebook.com/AmericasCountryClassics",
        "https://www.instagram.com/AmericasCountryClassics/"
      ]
    }

    <style>
        /* Local Fonts Declarations (Referencing Root /fonts/) */
        
        /* Bree Serif - Regular */
        @font-face {
            font-family: 'Bree Serif';
            src: url('/fonts/bree-serif-v18-latin-regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        /* Merriweather - Light (300) */
        @font-face {
            font-family: 'Merriweather';
            src: url('/fonts/merriweather-v33-latin-300.woff2') format('woff2');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }

        /* Merriweather - Regular (400) */
        @font-face {
            font-family: 'Merriweather';
            src: url('/fonts/merriweather-v33-latin-regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        /* Merriweather - Bold (700) */
        @font-face {
            font-family: 'Merriweather';
            src: url('/fonts/merriweather-v33-latin-700.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        /* Rye - Western Headline Display */
        @font-face {
            font-family: 'Rye';
            src: url('/fonts/rye-v17-latin-regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        /* Root Color Variables */
        :root {
            --bg-dark: #121212;
            --bg-card: #1c1a17;
            --accent-gold: #f59e0b;
            --accent-amber: #d97706;
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2e2823;
        }

        /* Global Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Merriweather', Georgia, serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background: linear-gradient(180deg, #1f1915 0%, #121212 100%);
            border-bottom: 2px solid var(--accent-amber);
            padding: 25px 15px;
            text-align: center;
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Scalable SVG Branding Header */
        .brand-header-svg {
            width: 100%;
            max-width: 680px;
            height: auto;
            display: block;
        }

        main {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 15px;
            flex: 1;
        }

        .player-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Rye', cursive, serif;
            font-size: 2.3rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h2 {
            font-family: 'Bree Serif', serif;
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        /* Player Embed Placeholder Container */
        .player-container {
            width: 100%;
            min-height: 160px;
            background-color: #0d0d0d;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed #332d27;
            padding: 20px;
            transition: border-color 0.3s ease;
        }

        .player-placeholder-text {
            font-family: 'Bree Serif', serif;
            color: var(--accent-gold);
            font-size: 1.2rem;
            margin-bottom: 6px;
        }

        .player-placeholder-sub {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Social Links */
        .social-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .social-links a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-family: 'Bree Serif', serif;
            font-size: 1.05rem;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .social-links a:hover {
            color: var(--accent-gold);
            transform: translateY(-2px);
        }

        .social-links svg {
            flex-shrink: 0;
        }

        footer {
            background-color: #0a0a0a;
            border-top: 1px solid var(--border-color);
            padding: 25px 15px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        footer a {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 700;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.75rem; }
            h2 { font-size: 1.05rem; }
            .player-card { padding: 20px 15px; }
            .social-links { gap: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <!-- Scalable SVG Header Banner / Logo -->
            <svg class="brand-header-svg" viewBox="0 0 650 140" xmlns="http://www.w3.org/2000/svg" aria-label="America's Country Classics Logo">
                <defs>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#fbbf24"/>
                        <stop offset="100%" stop-color="#d97706"/>
                    </linearGradient>
                </defs>
                <!-- Main Title using Rye -->
                <text x="325" y="55" font-family="'Rye', cursive, serif" font-size="38" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
                    AMERICA'S COUNTRY
                </text>
                <!-- Subtitle Badge using Bree Serif -->
                <rect x="205" y="75" width="240" height="38" rx="6" fill="url(#goldGrad)" />
                <text x="325" y="102" font-family="'Bree Serif', serif" font-weight="400" font-size="24" fill="#121212" text-anchor="middle" letter-spacing="4">
                    CLASSICS
                </text>
            </svg>
        </div>
    </header>
